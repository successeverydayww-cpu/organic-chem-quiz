<script>
const DATA=[{"n": 1, "section": "ALCOHOLS & DEHYDRATION", "q": "A student attempts to dehydrate an unknown alcohol using concentrated H<sub>2</sub>SO<sub>4</sub>. The reaction proceeds rapidly at room temperature without requiring significant heating to yield an alkene. Which structure represents the original alcohol?", "opts": ["CH<sub>3</sub>OH", "CH<sub>3</sub>CH<sub>2</sub>OH", "CH<sub>3</sub>CH(OH)CH<sub>3</sub>", "(CH<sub>3</sub>)<sub>3</sub>COH"], "ans": "D", "exp": "Tertiary carbocations formed during dehydration are most stable."}, {"n": 2, "section": "ALKYNES", "q": "Ethyne gas prepared by reacting calcium carbide (CaC<sub>2</sub>) with water contains acidic and reducing gaseous impurities such as PH<sub>3</sub> and H<sub>2</sub>S. Which specific reagent is utilized to purify the product, and why?", "opts": ["Concentrated H<sub>2</sub>SO<sub>4</sub> to absorb water vapor", "Dilute Acidified CuSO<sub>4</sub> solution to precipitate impurities", "Potassium permanganate (KMnO<sub>4</sub>) to oxidize the impurities", "Sodium metal in dry ether to react with acidic hydrogens"], "ans": "B", "exp": "Acidified CuSO<sub>4</sub> removes impurities like H<sub>2</sub>S and PH<sub>3</sub>."}, {"n": 3, "section": "ALKANES", "q": "Consider the complete combustion of one mole of a straight-chain alkane. If the reaction requires 11 moles of oxygen gas (O<sub>2</sub>), what is the molecular formula of the alkane?", "opts": ["C<sub>5</sub>H<sub>12</sub>", "C<sub>7</sub>H<sub>16</sub>", "C<sub>8</sub>H<sub>18</sub>", "C<sub>9</sub>H<sub>20</sub>"], "ans": "B", "exp": "Combustion equation: C<sub>7</sub>H<sub>16</sub> + 11O<sub>2</sub> → 7CO<sub>2</sub> + 8H<sub>2</sub>O."}, {"n": 4, "section": "CLASSIFICATION & ISOMERISM", "q": "An unknown organic compound X has a molecular formula isomeric with ethanol (C<sub>2</sub>H<sub>6</sub>O). Compound X is completely insoluble in water and fails to react with sodium metal or oxidizing agents like acidified K<sub>2</sub>Cr<sub>2</sub>O<sub>7</sub>. What is compound X?", "opts": ["Ethanal", "Dimethyl ether", "Methanol", "Ethanoic acid"], "ans": "B", "exp": "Dimethyl ether is an unreactive functional group isomer of ethanol."}, {"n": 5, "section": "REACTION MECHANISMS", "q": "When 2-bromopropane is treated with metallic sodium in the presence of dry ether (Wurtz Reaction), what is the major organic product formed?", "opts": ["n-Butane", "2,3-Dimethylbutane", "Propane", "n-Hexane"], "ans": "B", "exp": "Wurtz coupling of two isopropyl radicals forms 2,3-dimethylbutane."}, {"n": 6, "section": "ALCOHOLS & DEHYDRATION", "q": "Which statement correctly explains why tertiary alcohols undergo dehydration to alkenes at a faster rate compared to primary alcohols?", "opts": ["Primary alcohols form steric hindrance preventing elimination.", "Tertiary alcohols form a more stable tertiary carbocation intermediate.", "Primary alcohols have lower boiling points than tertiary alcohols.", "Tertiary alcohols possess stronger intermolecular hydrogen bonds."], "ans": "B", "exp": "Tertiary carbocation intermediates have the lowest activation energy."}, {"n": 7, "section": "ALKANES: PHYSICAL PROPERTIES", "q": "Equal masses of methane (CH<sub>4</sub>), ethane (C<sub>2</sub>H<sub>6</sub>), propane (C<sub>3</sub>H<sub>8</sub>), and butane (C<sub>4</sub>H<sub>10</sub>) are compared. Which compound has the lowest boiling point, and what is the primary structural factor responsible?", "opts": ["Butane, due to high molecular mass", "Methane, due to weak van der Waals forces and small surface area", "Ethane, due to symmetry", "Propane, due to non-polar bonds"], "ans": "B", "exp": "Methane has the smallest molecular weight and lowest van der Waals surface area."}, {"n": 8, "section": "ALKANES: HALOGENATION", "q": "Methane (CH<sub>4</sub>) reacts with chlorine (Cl<sub>2</sub>) in the presence of ultraviolet light. If an excess of chlorine gas is supplied, what will be the final predominant product of the substitution chain reaction?", "opts": ["Chloromethane (CH<sub>3</sub>Cl)", "Dichloromethane (CH<sub>2</sub>Cl<sub>2</sub>)", "Tetrachloromethane (CCl<sub>4</sub>)", "Chloroethane (C<sub>2</sub>H<sub>5</sub>Cl)"], "ans": "C", "exp": "Excess Cl<sub>2</sub> leads to complete substitution to form CCl<sub>4</sub>."}, {"n": 9, "section": "REACTION MECHANISMS", "q": "A reaction between ethylmagnesium chloride (CH<sub>3</sub>CH<sub>2</sub>MgCl) and methanal (HCHO) followed by acid hydrolysis yields which type of organic product?", "opts": ["Methanol", "Propan-1-ol (Primary alcohol)", "Propan-2-ol (Secondary alcohol)", "Ethanoic acid"], "ans": "B", "exp": "Grignard reagent + methanal yields a primary alcohol (Propan-1-ol)."}, {"n": 10, "section": "REACTION MECHANISMS", "q": "Ethanol (CH<sub>3</sub>CH<sub>2</sub>OH) is heated with concentrated H<sub>2</sub>SO<sub>4</sub>. How does altering the reaction temperature from 140°C to 180°C change the major organic product?", "opts": ["Shifts product from Diethyl ether to Ethene", "Shifts product from Ethene to Ethane", "Shifts product from Ethanal to Ethanoic acid", "Shifts product from Diethyl ether to Ethanal"], "ans": "A", "exp": "140°C gives ether (intermolecular); 180°C gives alkene (intramolecular)."}, {"n": 11, "section": "CLASSIFICATION", "q": "An organic compound is classified as an alicyclic hydrocarbon. Which structural feature must it possess?", "opts": ["A non-planar aromatic ring containing alternating double bonds", "A non-aromatic carbon ring system behaving like an aliphatic hydrocarbon", "A cyclic structure incorporating at least one heteroatom like nitrogen or oxygen", "An open straight-chain structure containing triple bonds"], "ans": "B", "exp": "Alicyclic compounds are non-aromatic carbon ring systems."}, {"n": 12, "section": "ALKANES: SOURCES", "q": "A sample of gas is composed of 80% methane (CH<sub>4</sub>) by volume. Based on general organic sources, which resource does this gas represent?", "opts": ["Coal gas", "Natural gas", "Liquefied petroleum gas (LPG)", "Producer gas"], "ans": "B", "exp": "Natural gas predominantly consists of methane."}, {"n": 13, "section": "CLASSIFICATION", "q": "Which of the following compounds is classified as a homocyclic aromatic hydrocarbon?", "opts": ["Cyclohexane", "Pyridine", "Benzene", "Tetrahydrofuran"], "ans": "C", "exp": "Benzene is a classic homocyclic aromatic hydrocarbon."}, {"n": 14, "section": "ISOMERISM", "q": "What type of isomerism is displayed by But-2-ene due to restricted rotation around its carbon-carbon double bond?", "opts": ["Optical isomerism", "Chain isomerism", "Geometric (cis-trans) isomerism", "Functional group isomerism"], "ans": "C", "exp": "Double bond restricted rotation produces geometric (<i>cis-trans</i>) isomers."}, {"n": 15, "section": "ISOMERISM", "q": "In coordination chemistry, the compound [Pt(NH<sub>3</sub>)<sub>2</sub>Cl<sub>2</sub>] exhibits cis-trans isomerism. Which geometric arrangement describes the <i>trans</i> isomer?", "opts": ["Identical ligands placed adjacent to each other at 90° angles", "Identical ligands placed opposite each other at 180° angles", "Ligands rotating freely around a single covalent bond", "A chiral arrangement rotating plane-polarized light"], "ans": "B", "exp": "<i>Trans</i> position places identical ligands opposite (180°)."}, {"n": 16, "section": "CLASSIFICATION", "q": "A hydrocarbon molecule contains two π (pi) bonds and one σ (sigma) bond between two adjacent carbon atoms. To which homologous series does this linkage belong?", "opts": ["Alkanes", "Alkenes", "Alkynes", "Cycloalkanes"], "ans": "C", "exp": "Triple bonds contain 1σ and 2π bonds."}, {"n": 17, "section": "ALKANES: PHYSICAL PROPERTIES", "q": "Liquid alkanes (such as pentane) float on top of water when mixed. What two physical properties explain this behavior?", "opts": ["Low boiling point and high polar solvent solubility", "Density lower than 1.0 g/cm<sup>3</sup> and insolubility in polar solvents", "High vapor pressure and strong hydrogen bonding capability", "High density and reactivity with water molecules"], "ans": "B", "exp": "Density &lt;1.0 g/cm<sup>3</sup> and non-polar nature cause floating."}, {"n": 18, "section": "ALKANES: PHYSICAL PROPERTIES", "q": "Pentane (C<sub>5</sub>H<sub>12</sub>) has a boiling point of 36°C, whereas 2,2-dimethylpropane (C<sub>5</sub>H<sub>12</sub>) boils at 9.5°C. What accounts for this difference?", "opts": ["2,2-Dimethylpropane has stronger intermolecular hydrogen bonds", "Increased branching reduces surface area, weakening van der Waals forces", "Pentane has a cyclic structure that stabilizes its liquid state", "2,2-Dimethylpropane contains polar carbon-carbon double bonds"], "ans": "B", "exp": "Branching reduces contact surface area, weakening dispersion forces."}, {"n": 19, "section": "ALKYNES", "q": "When ethyne (HC≡CH) undergoes catalytic hydrogenation using a Pd/Pt catalyst, what is the step-wise sequence of organic products formed?", "opts": ["Ethane followed by Ethene", "Ethene followed by Ethane", "Ethanol followed by Ethanal", "Methanal followed by Methane"], "ans": "B", "exp": "Sequential addition converts acetylene to ethene, then ethane."}, {"n": 20, "section": "ALKYNES", "q": "What product is obtained when ethyne reacts with hydrogen chloride (HCl) in a 1:1 molar ratio?", "opts": ["1,1-Dichloroethane", "Chloroethene (Vinyl chloride)", "1,2-Dichloroethane", "Chloroethane"], "ans": "B", "exp": "1:1 addition across the triple bond forms vinyl chloride."}, {"n": 21, "section": "REACTION MECHANISMS", "q": "What primary organic product is formed when ethylmagnesium iodide (CH<sub>3</sub>CH<sub>2</sub>MgI) is hydrolyzed with water/acid (H^+)?", "opts": ["Methane", "Ethane", "Propane", "Ethanol"], "ans": "B", "exp": "Grignard hydrolysis yields alkane (CH<sub>3</sub>CH<sub>3</sub>)."}, {"n": 22, "section": "AMINES", "q": "Ammonia (NH<sub>3</sub>) reacts with bromomethane (CH<sub>3</sub>Br). What type of organic amine is formed first in this reaction?", "opts": ["Primary amine (Methylamine)", "Secondary amine (Dimethylamine)", "Tertiary amine (Trimethylamine)", "Quaternary ammonium salt"], "ans": "A", "exp": "Initial nucleophilic substitution forms methylamine."}, {"n": 23, "section": "AMINES", "q": "An organic compound has the structural formula (CH<sub>3</sub>)<sub>3</sub>N. How should this compound be classified?", "opts": ["Primary amine", "Secondary amine", "Tertiary amine", "Amide"], "ans": "C", "exp": "Three carbon attachments on nitrogen define a tertiary amine."}, {"n": 24, "section": "ALCOHOLS: OXIDATION", "q": "Secondary alcohols are oxidized using acidified potassium dichromate (K<sub>2</sub>Cr<sub>2</sub>O<sub>7</sub>). What is the resulting organic product?", "opts": ["Alkanal (Aldehyde)", "Alkanone (Ketone)", "Carboxylic acid", "Ether"], "ans": "B", "exp": "Secondary alcohols oxidize to ketones."}, {"n": 25, "section": "ALCOHOLS: OXIDATION", "q": "Why do tertiary alcohols resist oxidation under standard conditions with acidified KMnO<sub>4</sub> or K<sub>2</sub>Cr<sub>2</sub>O<sub>7</sub>?", "opts": ["They lack a hydrogen atom bonded to the carbon atom bearing the hydroxyl group (α-carbon)", "They possess high steric hindrance around the oxygen atom", "They readily form stable carbocations that prevent oxidation", "Their boiling points are too low for oxidation reactions"], "ans": "A", "exp": "Tertiary alcohols lack α-hydrogens required for oxidation."}, {"n": 26, "section": "REACTION MECHANISMS", "q": "Ethanol reacts with ethanoic acid in the presence of concentrated H<sub>2</sub>SO<sub>4</sub>. What is the IUPAC name of the organic ester formed?", "opts": ["Methyl ethanoate", "Ethyl ethanoate", "Methoxy methane", "Ethoxy ethane"], "ans": "B", "exp": "Esterification forms ethyl ethanoate."}, {"n": 27, "section": "ALKANES: PHYSICAL PROPERTIES", "q": "Under room conditions, what physical states are occupied by the first four straight-chain alkanes (C<sub>1</sub> to C<sub>4</sub>)?", "opts": ["Liquids", "Gases", "Waxy solids", "Volatile oils"], "ans": "B", "exp": "C<sub>1</sub>–C<sub>4</sub> alkanes are gaseous at room temperature."}, {"n": 28, "section": "ETHERS", "q": "According to IUPAC nomenclature rules, how is the compound CH<sub>3</sub>-O-CH<sub>3</sub> systematically named?", "opts": ["Dimethyl ether", "Methoxymethane", "Ethoxymethane", "Propanone"], "ans": "B", "exp": "IUPAC alkoxyalkane naming yields methoxymethane."}, {"n": 29, "section": "ALKANES: PHYSICAL PROPERTIES", "q": "Which alkane member represents the threshold where waxy solid physical states begin to appear at room temperature?", "opts": ["C<sub>5</sub>H<sub>12</sub>", "C<sub>10</sub>H<sub>22</sub>", "C<sub>18</sub>H<sub>38</sub>", "C<sub>25</sub>H<sub>52</sub>"], "ans": "C", "exp": "C<sub>18</sub> and higher alkanes are waxy solids."}, {"n": 30, "section": "ALKANES: HALOGENATION", "q": "In halogenation of alkanes, why does fluorine (F<sub>2</sub>) react explosively with methane while iodine (I<sub>2</sub>) fails to react under direct sunlight?", "opts": ["Fluorine has lower electronegativity than iodine", "Fluorine reactions are extremely exothermic, while iodine reactions are endothermic/unfavorable", "Iodine undergoes substitution while fluorine undergoes elimination", "Iodine forms stable carbocations with methane"], "ans": "B", "exp": "Fluorination is highly exothermic; iodination is endothermic."}, {"n": 31, "section": "ALKENES", "q": "An alkene with the general formula C<sub>n</sub>H<sub>2n</sub> contains 6 carbon atoms. If it is a straight-chain isomer with a double bond at carbon-1, what is its expected physical state at room temperature?", "opts": ["Gas", "Liquid", "Solid", "Plasma"], "ans": "B", "exp": "Hex-1-ene is a liquid at room temperature."}, {"n": 32, "section": "ALCOHOLS: PHYSICAL PROPERTIES", "q": "Why do lower alcohols (such as methanol and ethanol) show high solubility in water, whereas hexan-1-ol shows limited water solubility?", "opts": ["The non-polar hydrocarbon chain length increases, overcoming hydroxyl group hydrogen bonding", "Methanol forms ionic bonds in water while hexanol forms covalent bonds", "Hexanol contains double bonds that prevent hydration", "Methanol has a higher density than water"], "ans": "A", "exp": "Larger alkyl groups mask polar -OH hydrogen bonding."}, {"n": 33, "section": "ALCOHOLS & DEHYDRATION", "q": "When methanol (CH<sub>3</sub>OH) is treated with concentrated H<sub>2</sub>SO<sub>4</sub> at 180°C, what is the primary organic product?", "opts": ["Methene (CH<sub>2</sub>)", "Methanal (HCHO)", "Dimethyl ether (CH<sub>3</sub>OCH<sub>3</sub>)", "No elimination reaction occurs to form an alkene"], "ans": "D", "exp": "Methanol lacks the 2-carbon chain minimum required to form an alkene."}, {"n": 34, "section": "ALCOHOLS: PHYSICAL PROPERTIES", "q": "How does the boiling point of primary, secondary, and tertiary isomeric alcohols vary?", "opts": ["Primary > Secondary > Tertiary", "Tertiary > Secondary > Primary", "Secondary > Primary > Tertiary", "Primary = Secondary = Tertiary"], "ans": "A", "exp": "Primary alcohols have unhindered hydrogen bonding."}, {"n": 35, "section": "ALKENES", "q": "Which reagent reacts with ethene (CH<sub>2</sub>=CH<sub>2</sub>) via an addition reaction to form 1,2-dichloroethane?", "opts": ["HCl gas", "Cl<sub>2</sub> gas", "NaCl solution", "CCl<sub>4</sub> solvent"], "ans": "B", "exp": "Direct addition of halogen gas (Cl<sub>2</sub>) yields 1,2-dichloroethane."}, {"n": 36, "section": "CLASSIFICATION", "q": "An aliphatic hydrocarbon contains only single C-C and C-H σ (sigma) bonds in an open chain. What general formula corresponds to this class of compounds?", "opts": ["C<sub>n</sub>H<sub>2n</sub>", "C<sub>n</sub>H<sub>2n+2</sub>", "C<sub>n</sub>H<sub>2n-2</sub>", "C<sub>n</sub>H<sub>n</sub>"], "ans": "B", "exp": "General alkane formula is C<sub>n</sub>H<sub>2n+2</sub>."}, {"n": 37, "section": "CLASSIFICATION", "q": "Which of the following solvents is classified as a non-polar solvent?", "opts": ["Water (H<sub>2</sub>O)", "Ethanol (CH<sub>3</sub>CH<sub>2</sub>OH)", "Benzene (C<sub>6</sub>H<sub>6</sub>)", "Methanol (CH<sub>3</sub>OH)"], "ans": "C", "exp": "Benzene is a non-polar solvent."}, {"n": 38, "section": "ALKENES", "q": "The hydration of ethene (CH<sub>2</sub>=CH<sub>2</sub> + H<sub>2</sub>O) to produce ethanol requires which catalyst and operational conditions?", "opts": ["H<sub>3</sub>PO<sub>4</sub> catalyst on SiO<sub>2</sub> at 300°C", "Concentrated H<sub>2</sub>SO<sub>4</sub> at 140°C", "Acidified KMnO<sub>4</sub> at room temperature", "Pd/Pt catalyst at high pressure"], "ans": "A", "exp": "Industrial hydration uses H<sub>3</sub>PO<sub>4</sub> at 300°C."}, {"n": 39, "section": "ALKENES", "q": "What type of reaction occurs when propene converts to propane using H<sub>2</sub> and a Nickel (Ni) catalyst?", "opts": ["Substitution reaction", "Addition / Reduction reaction", "Elimination reaction", "Condensation reaction"], "ans": "B", "exp": "Catalytic hydrogenation is an addition/reduction reaction."}, {"n": 40, "section": "CLASSIFICATION", "q": "What is the functional group present in an alkanone (ketone)?", "opts": ["-OH (Hydroxyl group)", "-CHO (Alkanal group)", ">C=O (Carbonyl group attached to two alkyl carbon groups)", "-COOH (Carboxyl group)"], "ans": "C", "exp": "Carbonyl attached to two carbon substituents forms a ketone."}, {"n": 41, "section": "ETHERS", "q": "Why are ethers (R-O-R) much less soluble in water compared to their isomeric alcohols (R-OH)?", "opts": ["Ethers lack a hydrogen atom directly bonded to oxygen, limiting hydrogen bond donation to water", "Ethers are completely non-polar molecules", "Ethers react with water to form insoluble alkanes", "Ethers have higher molecular masses than their isomeric alcohols"], "ans": "A", "exp": "Ethers lack hydrogen bond donor sites (-OH)."}, {"n": 42, "section": "CLASSIFICATION", "q": "What functional group is represented by the notation -C≡N?", "opts": ["Amine", "Nitrile", "Alkyl halide", "Alkanal"], "ans": "B", "exp": "Nitrile group is represented as -C≡N."}, {"n": 43, "section": "ETHERS", "q": "Which of the following is a key physical property of low molecular weight ethers?", "opts": ["Unreactive solids with high melting points", "Highly volatile and flammable liquids that ignite easily", "Strongly basic liquids that dissolve ionic salts", "Highly dense liquids that sink below water"], "ans": "B", "exp": "Low molecular weight ethers are volatile and flammable."}, {"n": 44, "section": "ALKENES", "q": "Which statement correctly compares the melting points (M.P.) and boiling points (B.P.) of branched alkenes against their corresponding straight-chain isomers?", "opts": ["Branched isomers have higher B.P. and higher M.P.", "Branched isomers have lower B.P. and higher M.P. compared to straight-chain isomers", "Branched isomers have lower B.P. and lower M.P.", "Branching has no effect on physical properties"], "ans": "B", "exp": "Branching lowers boiling point but symmetrical packing can raise melting point."}, {"n": 45, "section": "ALKYNES", "q": "In the preparation of alkynes from calcium carbide (CaC<sub>2</sub>), what secondary inorganic product is formed alongside ethyne (C<sub>2</sub>H<sub>2</sub>)?", "opts": ["CaO", "Ca(OH)<sub>2</sub>", "CaCO<sub>3</sub>", "CaCl<sub>2</sub>"], "ans": "B", "exp": "Calcium carbide hydrolysis yields Ca(OH)<sub>2</sub>."}, {"n": 46, "section": "ALCOHOLS: OXIDATION", "q": "Oxidation of ethanol (CH<sub>3</sub>CH<sub>2</sub>OH) with acidified KMnO<sub>4</sub> under reflux yields which final product?", "opts": ["Ethanal (CH<sub>3</sub>CHO)", "Ethanoic acid (CH<sub>3</sub>COOH)", "Methanoic acid (HCOOH)", "Diethyl ether (CH<sub>3</sub>CH<sub>2</sub>OCH<sub>2</sub>CH<sub>3</sub>)"], "ans": "B", "exp": "Strong oxidation of primary alcohols produces ethanoic acid."}, {"n": 47, "section": "CLASSIFICATION", "q": "What type of structural classification applies to Cyclopropane?", "opts": ["Open-chain aliphatic alkane", "Alicyclic / Homocyclic saturated hydrocarbon", "Heterocyclic aromatic hydrocarbon", "Unsaturated alkyne derivative"], "ans": "B", "exp": "Cyclopropane is a saturated alicyclic hydrocarbon."}, {"n": 48, "section": "AMINES", "q": "What is the structural formula of primary amine methylamine?", "opts": ["CH<sub>3</sub>NH<sub>2</sub>", "(CH<sub>3</sub>)<sub>2</sub>NH", "(CH<sub>3</sub>)<sub>3</sub>N", "CH<sub>3</sub>CN"], "ans": "A", "exp": "Methylamine formula is CH<sub>3</sub>NH<sub>2</sub>."}, {"n": 49, "section": "ISOMERISM", "q": "Which of the following compounds displays optical isomerism?", "opts": ["Propane", "Lactic acid (containing a chiral carbon atom with 4 distinct substituents)", "Ethene", "But-2-ene"], "ans": "B", "exp": "Lactic acid has a chiral carbon attached to four distinct groups."}, {"n": 50, "section": "CLASSIFICATION", "q": "According to the IUPAC systemic guidelines, what steps must be prioritized when naming branched hydrocarbons containing functional groups?", "opts": ["Select the longest carbon chain containing the functional group, then number from the end giving the functional group/substituents the lowest locant", "Always list substituents in order of decreasing molecular weight", "Number the parent chain from left to right regardless of branching", "Ignore functional groups and select the longest continuous carbon chain anywhere in the molecule"], "ans": "A", "exp": "Longest chain with functional group determines numbering priority."}];
let picks=Array(50).fill(null), graded=false;
const list=document.getElementById('list');
let lastSec='', html='';
DATA.forEach(function(q,i){
  if(q.section!==lastSec){html+='<div class="sechead">'+q.section+'</div>';lastSec=q.section;}
  html+='<div class="card" id="c'+i+'"><div class="qmeta"><span class="qnum">Q'+q.n+'</span><span class="qtag">'+(i+1)+' of 50</span></div><div class="qtext">'+q.q+'</div>';
  q.opts.forEach(function(o,j){
    html+='<div class="opt" id="o'+i+'_'+j+'" onclick="pick('+i+','+j+')"><span class="key">'+'ABCD'[j]+'</span><span>'+o+'</span></div>';
  });
  html+='<div class="verdict" id="v'+i+'"></div><div class="exp"><b>EXPLANATION</b>'+q.exp+'</div></div>';
});
list.innerHTML=html;
function pick(i,j){
  if(graded)return;
  picks[i]=j;
  for(let k=0;k<4;k++)document.getElementById('o'+i+'_'+k).classList.toggle('sel',k===j);
  document.getElementById('prog').textContent=picks.filter(function(p){return p!==null}).length+' / 50 answered';
}
function grade(){
  if(graded)return;
  const un=picks.filter(function(p){return p===null}).length;
  let correct=0;
  DATA.forEach(function(q,i){
    const a='ABCD'.indexOf(q.ans);
    for(let k=0;k<4;k++){
      const el=document.getElementById('o'+i+'_'+k);
      el.classList.add('dis');el.classList.remove('sel');
      if(k===a)el.classList.add('correct');
      else if(picks[i]===k)el.classList.add('miss');
    }
    const card=document.getElementById('c'+i), v=document.getElementById('v'+i);
    card.classList.add('done');
    if(picks[i]===a){correct++;card.classList.add('right');v.textContent='✔ Correct';v.className='verdict ok';}
    else{card.classList.add('wrong');v.textContent=picks[i]===null?'— Not answered':'✘ Wrong';v.className='verdict no';}
  });
  graded=true;
  const pct=Math.round(correct/50*100);
  document.getElementById('scoreN').textContent=correct+'/50';
  document.getElementById('scoreD').textContent=correct+' correct · '+(50-correct-un)+' wrong · '+un+' unanswered · '+pct+'%';
  document.getElementById('scoreM').textContent=pct>=70?'Excellent — pass mark cleared.':(pct>=50?'Fair. Review the explanations and retake.':'Study the explanations below, then retake.');
  const s=document.getElementById('score');s.classList.add('show');
  s.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit').style.display='none';
  document.getElementById('reset').style.display='block';
}
function resetAll(){
  graded=false;picks=Array(50).fill(null);
  document.querySelectorAll('.opt').forEach(function(e){e.classList.remove('sel','correct','miss','dis');});
  document.querySelectorAll('.card').forEach(function(e){e.classList.remove('done','right','wrong');});
  document.querySelectorAll('.verdict').forEach(function(e){e.textContent='';});
  document.getElementById('score').classList.remove('show');
  document.getElementById('submit').style.display='block';
  document.getElementById('reset').style.display='none';
  document.getElementById('prog').textContent='0 / 50 answered';
  window.scrollTo({top:0,behavior:'smooth'});
}

/* --- rich keyboard-style background music (self-contained, offline-safe) --- */
var MUS={ctx:null,master:null,wet:null,timer:null,nextT:0,ci:0,on:false,userStopped:false};
MUS.prog=[
 {b:36,notes:[60,64,67],mel:[[0,76],[2,79],[4,84],[8,83],[10,79],[12,76]]},
 {b:35,notes:[59,62,67],mel:[[0,74],[2,71],[4,74],[8,76],[10,74],[12,71]]},
 {b:33,notes:[57,60,64],mel:[[0,72],[2,76],[4,81],[8,79],[10,76],[12,72]]},
 {b:29,notes:[57,60,65],mel:[[0,69],[2,72],[4,77],[8,76],[10,72],[12,69]]}
];
function mf(m){return 440*Math.pow(2,(m-69)/12);}
MUS.init=function(){if(MUS.ctx)return;
  MUS.ctx=new (window.AudioContext||window.webkitAudioContext)();
  var lp=MUS.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3800;
  MUS.master=MUS.ctx.createGain();MUS.master.gain.value=0.9;
  MUS.master.connect(lp);lp.connect(MUS.ctx.destination);
  var dl=MUS.ctx.createDelay(1);dl.delayTime.value=0.29;
  var fb=MUS.ctx.createGain();fb.gain.value=0.32;
  MUS.wet=MUS.ctx.createGain();MUS.wet.gain.value=0.22;
  lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(MUS.wet);MUS.wet.connect(MUS.ctx.destination);};
MUS.note=function(t,f,vel,dur){
  var g=MUS.ctx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vel,t+0.012);
  g.gain.exponentialRampToValueAtTime(Math.max(vel*0.3,0.001),t+0.25);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  g.connect(MUS.master);
  [['sine',1,1],['sine',2,0.35],['triangle',3,0.12]].forEach(function(p){
    var o=MUS.ctx.createOscillator();o.type=p[0];o.frequency.value=f*p[1];
    var og=MUS.ctx.createGain();og.gain.value=p[2];
    o.connect(og);og.connect(g);o.start(t);o.stop(t+dur+0.1);});};
MUS.padn=function(t,f,dur){
  var g=MUS.ctx.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(0.026,t+1.4);
  g.gain.setValueAtTime(0.026,Math.max(t+1.4,t+dur-1.6));
  g.gain.linearRampToValueAtTime(0,t+dur);
  var o=MUS.ctx.createOscillator();o.type='sine';o.frequency.value=f;
  o.connect(g);g.connect(MUS.master);o.start(t);o.stop(t+dur+0.1);
  var o2=MUS.ctx.createOscillator();o2.type='sine';o2.frequency.value=f*2;
  var g2=MUS.ctx.createGain();g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(0.011,t+2);g2.gain.linearRampToValueAtTime(0,t+dur);
  o2.connect(g2);g2.connect(MUS.master);o2.start(t);o2.stop(t+dur+0.1);};
MUS.schedChord=function(t0){
  var ch=MUS.prog[MUS.ci%4],B=0.8,len=8*B,i;
  MUS.padn(t0,mf(ch.b+12),len);
  ch.notes.forEach(function(n){MUS.padn(t0,mf(n),len);});
  MUS.note(t0,mf(ch.b),0.09,2.8);
  ch.notes.forEach(function(n){MUS.note(t0,mf(n),0.05,1.7);});
  var seq=[0,1,2,1];
  for(i=2;i<16;i+=2){if(i%8!==0){MUS.note(t0+i*0.4,mf(ch.notes[seq[(i/2)%4]]),0.022,0.5);}}
  ch.mel.forEach(function(m){MUS.note(t0+m[0]*0.4,mf(m[1]),0.085,0.85);});
  MUS.ci++;
  return len;};
MUS.loop=function(){
  var len=MUS.schedChord(MUS.nextT);
  MUS.nextT=MUS.nextT+len;
  MUS.timer=setTimeout(MUS.loop,Math.max(100,(MUS.nextT-MUS.ctx.currentTime-0.35)*1000));};
MUS.ui=function(on){var b=document.getElementById('mus');if(!b)return;b.textContent=on?'\u23f8':'\u266a';b.classList.toggle('playing',on);b.setAttribute('aria-label',on?'Pause background music':'Play background music');};
MUS.start=function(){MUS.init();MUS.ctx.resume();if(MUS.on)return;MUS.on=true;MUS.ci=0;MUS.nextT=MUS.ctx.currentTime+0.15;MUS.loop();MUS.ui(true);};
MUS.stop=function(){if(!MUS.on)return;MUS.on=false;clearTimeout(MUS.timer);MUS.ui(false);};
function musToggle(){if(MUS.on){MUS.userStopped=true;MUS.stop();}else{MUS.userStopped=false;MUS.start();}}
MUS.autostart=function(){if(MUS.on||MUS.userStopped)return;try{MUS.start();}catch(e){}};
window.addEventListener('load',function(){setTimeout(MUS.autostart,300);});
['touchstart','pointerdown','keydown'].forEach(function(ev){document.addEventListener(ev,MUS.autostart,{capture:true});});
