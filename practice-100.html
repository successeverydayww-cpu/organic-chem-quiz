<script>
const DATA=[{"n": 1, "section": "CLASSIFICATION & NOMENCLATURE", "q": "The correct IUPAC name of the compound (CH<sub>3</sub>)<sub>2</sub>C(CH<sub>2</sub>CH<sub>3</sub>)<sub>2</sub> is:", "opts": ["2,2-dimethylbutane", "3-ethylpentane", "3,3-dimethylpentane", "2,2-diethylpropane"], "ans": "C", "exp": "The longest continuous chain passes through the two ethyl groups: CH<sub>3</sub>CH<sub>2</sub>-C-CH<sub>2</sub>CH<sub>3</sub>, a pentane with the central carbon as C-3. The two methyl groups therefore carry locant 3, giving 3,3-dimethylpentane."}, {"n": 2, "section": "CLASSIFICATION & NOMENCLATURE", "q": "How many structural (chain) isomers does an open-chain alkane with molecular formula C<sub>5</sub>H<sub>12</sub> possess?", "opts": ["2", "3", "4", "5"], "ans": "B", "exp": "C<sub>5</sub>H<sub>12</sub> has three chain isomers: pentane, 2-methylbutane and 2,2-dimethylpropane."}, {"n": 3, "section": "CLASSIFICATION & NOMENCLATURE", "q": "How many alcohols (structural isomers) have the molecular formula C<sub>4</sub>H<sub>10</sub>O?", "opts": ["2", "3", "5", "4"], "ans": "D", "exp": "Four: butan-1-ol, butan-2-ol, 2-methylpropan-1-ol and 2-methylpropan-2-ol."}, {"n": 4, "section": "CLASSIFICATION & NOMENCLATURE", "q": "Which two classes of organic compounds share the same general formula C<sub>n</sub>H<sub>2n</sub>?", "opts": ["Alkanes and cycloalkanes", "Alkenes and cycloalkanes", "Alkynes and dienes", "Alkanes and alkenes"], "ans": "B", "exp": "Open-chain alkenes and cycloalkanes are both C<sub>n</sub>H<sub>2n</sub>, which is why e.g. propene and cyclopropane (both C<sub>3</sub>H<sub>6</sub>) are ring-chain isomers."}, {"n": 5, "section": "CLASSIFICATION & NOMENCLATURE", "q": "The molecular formula C<sub>3</sub>H<sub>6</sub> could represent an alkene and:", "opts": ["an alcohol", "a cycloalkane", "an alkyne", "an ether"], "ans": "B", "exp": "C<sub>3</sub>H<sub>6</sub> fits propene (C<sub>n</sub>H<sub>2n</sub>) and also cyclopropane, the smallest alicyclic ring."}, {"n": 6, "section": "CLASSIFICATION & NOMENCLATURE", "q": "Which of the following is a heterocyclic compound?", "opts": ["Benzene", "Cyclohexane", "Pyridine", "Methylbenzene"], "ans": "C", "exp": "Pyridine has a six-membered ring in which one carbon is replaced by a nitrogen atom, making the ring heterocyclic. Benzene, cyclohexane and methylbenzene contain carbon atoms only."}, {"n": 7, "section": "CLASSIFICATION & NOMENCLATURE", "q": "In IUPAC nomenclature, the suffix '-one' indicates the presence of:", "opts": ["an aldehyde group", "a ketone group", "an alcohol group", "a carboxyl group"], "ans": "B", "exp": "'-al' marks aldehydes, '-ol' alcohols, '-oic acid' carboxylic acids, and '-one' marks ketones (propanone, butan-2-one)."}, {"n": 8, "section": "CLASSIFICATION & NOMENCLATURE", "q": "A functional group is best defined as:", "opts": ["any atom other than carbon or hydrogen in a molecule", "the longest carbon chain in a molecule", "an atom or group of atoms that determines the characteristic chemical properties of a compound", "a group that only affects physical properties"], "ans": "C", "exp": "Functional groups like -OH, -COOH, C=C and -NH<sub>2</sub> govern how a compound reacts, regardless of chain length; members of different homologous series share one."}, {"n": 9, "section": "CLASSIFICATION & NOMENCLATURE", "q": "The compound CH<sub>3</sub>CH<sub>2</sub>COOCH<sub>3</sub> belongs to which homologous series?", "opts": ["Acids", "Ethers", "Ketones", "Esters"], "ans": "D", "exp": "The -COO- linkage between the carbonyl carbon and an oxygen shows it is the ester methyl propanoate (an acid would be -COOH)."}, {"n": 10, "section": "CLASSIFICATION & NOMENCLATURE", "q": "Which of the following is a saturated hydrocarbon?", "opts": ["C<sub>2</sub>H<sub>4</sub>", "C<sub>6</sub>H<sub>6</sub>", "C<sub>4</sub>H<sub>10</sub>", "C<sub>3</sub>H<sub>6</sub>"], "ans": "C", "exp": "Only C<sub>4</sub>H<sub>10</sub> (C<sub>n</sub>H<sub>2n+2</sub>) contains single bonds exclusively. C<sub>2</sub>H<sub>4</sub> and C<sub>3</sub>H<sub>6</sub> are unsaturated, and benzene is aromatic."}, {"n": 11, "section": "CLASSIFICATION & NOMENCLATURE", "q": "The general formula C<sub>n</sub>H<sub>2n+2</sub> applies to:", "opts": ["alkanes and cycloalkanes", "alkanes only", "alkenes only", "alkynes and alkenes"], "ans": "B", "exp": "Each ring closure or double bond removes two hydrogens, so only open-chain saturated alkanes obey C<sub>n</sub>H<sub>2n+2</sub>; cycloalkanes are C<sub>n</sub>H<sub>2n</sub>."}, {"n": 12, "section": "CLASSIFICATION & NOMENCLATURE", "q": "The key structural feature that distinguishes aromatic from alicyclic compounds is:", "opts": ["the presence of a carbon ring", "the presence of side chains", "a delocalized π-electron system giving extra stability", "the presence of at least one double bond"], "ans": "C", "exp": "Alicyclic compounds may contain a ring and even double bonds, but aromatics like benzene have a fully delocalized π system (resonance) that makes them unusually stable."}, {"n": 13, "section": "ISOMERISM", "q": "The total number of structural isomers of C<sub>4</sub>H<sub>9</sub>Cl is:", "opts": ["2", "3", "5", "4"], "ans": "D", "exp": "Four: 1-chlorobutane, 2-chlorobutane, 1-chloro-2-methylpropane and 2-chloro-2-methylpropane."}, {"n": 14, "section": "ISOMERISM", "q": "Which of the following alcohols is optically active?", "opts": ["Butan-2-ol", "Butan-1-ol", "Propan-2-ol", "2-methylpropan-2-ol"], "ans": "A", "exp": "In butan-2-ol, C-2 carries four different groups (H, OH, CH<sub>3</sub>, C<sub>2</sub>H<sub>5</sub>), so it is chiral. In the others, no carbon carries four different substituents."}, {"n": 15, "section": "ISOMERISM", "q": "But-1-ene and 2-methylpropene are examples of:", "opts": ["chain (skeletal) isomerism", "position isomerism", "geometric isomerism", "functional group isomerism"], "ans": "A", "exp": "Both are C<sub>4</sub>H<sub>8</sub> with the same functional group, but one has a straight chain and the other a branched skeleton."}, {"n": 16, "section": "ISOMERISM", "q": "Which pair are functional group isomers?", "opts": ["But-1-ene and but-2-ene", "Propanal and propanone", "Pentane and 2-methylbutane", "Butan-1-ol and butan-2-ol"], "ans": "B", "exp": "Propanal (an aldehyde) and propanone (a ketone) share the formula C<sub>3</sub>H<sub>6</sub>O but belong to different homologous series."}, {"n": 17, "section": "ISOMERISM", "q": "Which compound CANNOT exhibit cis-trans (geometric) isomerism?", "opts": ["But-1-ene", "But-2-ene", "Pent-2-ene", "Hex-3-ene"], "ans": "A", "exp": "For cis-trans isomerism each doubly-bonded carbon must carry two different groups. In but-1-ene the terminal carbon of the double bond carries two identical hydrogen atoms."}, {"n": 18, "section": "ISOMERISM", "q": "Between the cis and trans isomers of but-2-ene, which has the higher boiling point and why?", "opts": ["cis, because it has a net dipole moment making the molecule polar", "trans, because it is more symmetrical", "trans, because it packs better in the crystal", "they have identical boiling points"], "ans": "A", "exp": "In the cis isomer the two polar C-H dipoles do not cancel, giving a net molecular dipole, so cis-but-2-ene is slightly polar and has the higher boiling point. The trans isomer's better packing gives it the higher melting point instead."}, {"n": 19, "section": "ISOMERISM", "q": "CH<sub>3</sub>-O-C<sub>3</sub>H<sub>7</sub> and C<sub>2</sub>H<sub>5</sub>-O-C<sub>2</sub>H<sub>5</sub> (both C<sub>4</sub>H<sub>10</sub>O) are:", "opts": ["metamers", "chain isomers", "position isomers", "functional group isomers"], "ans": "A", "exp": "Metamerism arises when the same functional group (here the ether oxygen) divides the carbon skeleton unequally: methoxypropane versus ethoxyethane differ in the sizes of the groups on either side of the oxygen."}, {"n": 20, "section": "ISOMERISM", "q": "How many sigma (σ) and pi (π) bonds respectively are present in one molecule of propyne, CH<sub>3</sub>-C≡CH?", "opts": ["5 σ, 2 π", "6 σ, 2 π", "6 σ, 3 π", "7 σ, 2 π"], "ans": "B", "exp": "Count σ bonds: three C-H in CH<sub>3</sub>, one C-C single bond, one σ within the C≡C triple bond, one C-H on the end carbon = 6 σ. The triple bond contributes 2 π bonds."}, {"n": 21, "section": "ISOMERISM", "q": "Which pair illustrates position isomerism?", "opts": ["Propanal and propanone", "Ethanol and methoxymethane", "But-1-ene and but-2-ene", "Pentane and 2-methylbutane"], "ans": "C", "exp": "The double bond occupies different positions (C-1 versus C-2) on the same carbon skeleton."}, {"n": 22, "section": "ISOMERISM", "q": "2-chlorobutane exhibits optical isomerism because:", "opts": ["it contains a chlorine atom", "carbon-2 is bonded to four different groups", "it contains an asymmetric mass distribution", "its molecules are non-polar"], "ans": "B", "exp": "C-2 carries H, Cl, CH<sub>3</sub> and C<sub>2</sub>H<sub>5</sub>, making it a chiral (asymmetric) carbon, so the two mirror-image forms rotate plane-polarized light in opposite directions."}, {"n": 23, "section": "ALKANES", "q": "In the free-radical chlorination of methane under UV light, the initiation step is:", "opts": ["homolytic fission of the Cl-Cl bond into two chlorine radicals", "heterolytic fission of the Cl-Cl bond", "attack of a Cl<sup>+</sup> ion on methane", "combination of two methyl radicals"], "ans": "A", "exp": "UV light supplies the energy to split Cl<sub>2</sub> homolytically into two Cl• radicals, each keeping one electron of the shared pair."}, {"n": 24, "section": "ALKANES", "q": "In the propagation step of methane chlorination, the methyl radical reacts with chlorine to give:", "opts": ["CH<sub>3</sub>Cl + Cl•", "CH<sub>3</sub>Cl + HCl", "CH<sub>2</sub>Cl<sub>2</sub> + H•", "CH<sub>4</sub> + Cl<sub>2</sub>"], "ans": "A", "exp": "CH<sub>3</sub>• + Cl<sub>2</sub> → CH<sub>3</sub>Cl + Cl• regenerates the chlorine radical, so one photon can convert many molecules (a chain reaction)."}, {"n": 25, "section": "ALKANES", "q": "When propane is chlorinated with one mole of Cl<sub>2</sub> (UV light), the major product is:", "opts": ["2-chloropropane", "1-chloropropane", "equal amounts of both", "1,2-dichloropropane"], "ans": "A", "exp": "Abstraction of a secondary hydrogen gives the more stable secondary radical, so 2-chloropropane predominates over 1-chloropropane."}, {"n": 26, "section": "ALKANES", "q": "The reference hydrocarbon assigned an octane number of 100 is:", "opts": ["n-heptane", "2,2,4-trimethylpentane (iso-octane)", "n-octane", "methane"], "ans": "B", "exp": "Iso-octane burns with the smoothest combustion and defines the 100 point of the octane scale; n-heptane, which knocks badly, is 0."}, {"n": 27, "section": "ALKANES", "q": "Fuels rich in which hydrocarbons reduce knocking in petrol engines most effectively?", "opts": ["straight-chain alkanes", "cycloalkanes with large rings", "n-heptane", "branched-chain alkanes"], "ans": "D", "exp": "Branched alkanes burn more smoothly, which is why catalytic reforming and isomerization convert straight chains into branched isomers to raise the octane rating."}, {"n": 28, "section": "ALKANES", "q": "Cracking in petroleum refining is best described as:", "opts": ["oxidation of heavy oils with air", "separation of crude oil into fractions by boiling point", "thermal decomposition of large hydrocarbon molecules into smaller alkanes and alkenes", "removal of sulphur from petrol"], "ans": "C", "exp": "Large molecules are broken (often over a catalyst, with heat) into smaller, more useful alkanes and alkenes, e.g. C<sub>10</sub>H<sub>22</sub> → C<sub>8</sub>H<sub>18</sub> + C<sub>2</sub>H<sub>4</sub>. Separation by boiling point is fractional distillation, not cracking."}, {"n": 29, "section": "ALKANES", "q": "A Wurtz reaction is carried out using a 1:1 mixture of CH<sub>3</sub>I and C<sub>2</sub>H<sub>5</sub>I with excess sodium in dry ether. The organic products are:", "opts": ["ethane only", "butane only", "propane only", "ethane, propane and butane"], "ans": "D", "exp": "Each radical can couple with its own kind (ethane from 2 CH<sub>3</sub>•, butane from 2 C<sub>2</sub>H<sub>5</sub>•) and cross-coupling gives propane, so three alkanes form."}, {"n": 30, "section": "ALKANES", "q": "In Kolbe's electrolysis of a concentrated aqueous solution of sodium ethanoate, the product liberated at the anode is:", "opts": ["methane", "ethane", "ethene", "hydrogen"], "ans": "B", "exp": "2 CH<sub>3</sub>COO<sup>-</sup> - 2e<sup>-</sup> → C<sub>2</sub>H<sub>6</sub> + 2CO<sub>2</sub>. The ethanoate radicals dimerize at the anode to ethane; hydrogen forms at the cathode."}, {"n": 31, "section": "ALKANES", "q": "Alkanes are chemically unreactive (paraffins) mainly because:", "opts": ["their C-C and C-H bonds are strong and non-polar, offering no reactive site", "they are non-existent in ionic form", "they are insoluble in water", "they have low boiling points"], "ans": "A", "exp": "With only strong, essentially non-polar σ bonds and no functional group, alkanes undergo no attack by common acids, bases or oxidizing agents, reacting mainly by radical substitution under harsh conditions."}, {"n": 32, "section": "ALKENES", "q": "The major product when propene reacts with HBr in the ABSENCE of peroxides is:", "opts": ["1-bromopropane", "1,2-dibromopropane", "2-bromopropan-2-ol", "2-bromopropane"], "ans": "D", "exp": "Markovnikov addition: H adds to the CH<sub>2</sub> end (which has more hydrogens), forming the more stable secondary carbocation, which Br<sup>-</sup> then attacks at C-2."}, {"n": 33, "section": "ALKENES", "q": "When propene reacts with HBr IN THE PRESENCE of peroxides, the main product is:", "opts": ["2-bromopropane", "1,2-dibromopropane", "propane", "1-bromopropane"], "ans": "D", "exp": "The peroxide (Kharasch) effect reverses the orientation: a Br• radical adds first to the terminal carbon, generating the more stable secondary carbon radical, so bromine ends up on the end carbon of 1-bromopropane."}, {"n": 34, "section": "ALKENES", "q": "The peroxide effect is observed with HBr but NOT with HCl or HI. Why?", "opts": ["Cl<sub>2</sub> and I<sub>2</sub> are too unreactive", "peroxides react with HCl and HI and destroy them", "alkenes cannot add HCl or HI at all", "only with HBr are both chain-propagation steps exothermic; the key step is endothermic for HCl and for HI"], "ans": "D", "exp": "A radical chain propagates only when every step is exothermic. For HCl, abstraction of H by the alkyl radical is too endothermic; for HI, addition of the I• radical to the alkene is unfavourable. HBr alone satisfies both steps, so it alone shows the anti-Markovnikov peroxide effect."}, {"n": 35, "section": "ALKENES", "q": "Baeyer's reagent used to test for unsaturation is:", "opts": ["acidified potassium dichromate", "bromine in tetrachloromethane", "dilute alkaline potassium permanganate", "ammoniacal silver nitrate"], "ans": "C", "exp": "Dilute, cold KMnO<sub>4</sub> (alkaline) decolourizes from purple to brown MnO<sub>2</sub> when it adds across a double bond, forming a vicinal diol; ethene gives ethane-1,2-diol."}, {"n": 36, "section": "ALKENES", "q": "Ozonolysis of propene (CH<sub>3</sub>CH=CH<sub>2</sub>) produces:", "opts": ["ethanal and methanal", "ethanoic acid and methanoic acid", "propanal only", "ethanol and methanol"], "ans": "A", "exp": "The double bond is cleaved; each doubly-bonded carbon becomes a carbonyl: the CH<sub>3</sub>CH= end gives ethanal and the =CH<sub>2</sub> end gives methanal."}, {"n": 37, "section": "ALKENES", "q": "The rapid decolourization of bromine water by a hydrocarbon involves:", "opts": ["free-radical substitution in the dark", "oxidation of an alkane", "electrophilic addition across the C=C bond of an alkene", "dissolution with no reaction"], "ans": "C", "exp": "The electron-rich π bond polarizes Br<sub>2</sub> and accepts Br<sup>+</sup>, then Br<sup>-</sup> completes the addition. Alkanes do not decolourize bromine water in the dark, making this the classic unsaturation test."}, {"n": 38, "section": "ALKENES", "q": "Dehydration of butan-2-ol with concentrated H<sub>2</sub>SO<sub>4</sub> at 180°C gives mainly:", "opts": ["but-2-ene", "but-1-ene", "an equal mixture of both", "2-methylpropene"], "ans": "A", "exp": "Saytzeff's rule: elimination favors the more substituted (more stable) alkene, so the internal double bond of but-2-ene predominates."}, {"n": 39, "section": "ALKENES", "q": "Ethene for industry is obtained principally by:", "opts": ["fermentation of glucose", "cracking (and catalytic dehydrogenation) of petroleum fractions", "esterification", "the Wurtz reaction"], "ans": "B", "exp": "Thermal/catalytic cracking of naphtha or dehydrogenation of ethane supplies industrial ethene, the feedstock for polyethene and ethanol manufacture."}, {"n": 40, "section": "ALKENES", "q": "In the older industrial route, ethene is absorbed in cold concentrated H<sub>2</sub>SO<sub>4</sub> before hydrolysis to ethanol. The intermediate formed is:", "opts": ["ethyl hydrogen sulfate (C<sub>2</sub>H<sub>5</sub>OSO<sub>3</sub>H)", "ethyl ethanoate", "diethyl ether", "ethanal"], "ans": "A", "exp": "Electrophilic addition of H<sub>2</sub>SO<sub>4</sub> across the double bond gives ethyl hydrogen sulfate, which on warming with water hydrolyses to ethanol and regenerates the acid."}, {"n": 41, "section": "ALKENES", "q": "The formation of poly(ethene) from ethene is best described as:", "opts": ["addition polymerization with no by-product", "condensation polymerization with loss of water", "free-radical substitution", "esterification"], "ans": "A", "exp": "Thousands of ethene molecules add across their double bonds; every atom of the monomer is retained in the polymer, so no small molecule is eliminated."}, {"n": 42, "section": "ALKENES", "q": "Which reagent distinguishes ethyne from ethene?", "opts": ["Bromine water", "Dilute KMnO<sub>4</sub>", "Concentrated H<sub>2</sub>SO<sub>4</sub>", "Ammoniacal silver nitrate"], "ans": "D", "exp": "Ethyne's acidic terminal hydrogen forms a white precipitate of silver acetylide with ammoniacal AgNO<sub>3</sub>, while ethene gives no reaction. Bromine water and KMnO<sub>4</sub> are decolourized by both."}, {"n": 43, "section": "ALKENES", "q": "The direct catalytic hydration of ethene (H<sub>3</sub>PO<sub>4</sub> on SiO<sub>2</sub>, 300°C, high pressure) yields:", "opts": ["ethanal", "ethanoic acid", "diethyl ether", "ethanol"], "ans": "D", "exp": "Water adds across the double bond under the phosphoric(V) acid catalyst to give ethanol, the modern industrial alternative to fermentation."}, {"n": 44, "section": "ALKYNES", "q": "Ethyne reacts with hot water in the presence of HgSO<sub>4</sub>/H<sub>2</sub>SO<sub>4</sub> catalyst (Kucherov reaction). The product is:", "opts": ["ethanal", "ethanol", "ethanoic acid", "propanone"], "ans": "A", "exp": "Markovnikov hydration first gives the unstable vinyl alcohol (ethenol), which immediately tautomerizes to ethanal, CH<sub>3</sub>CHO."}, {"n": 45, "section": "ALKYNES", "q": "When ethyne reacts with EXCESS hydrogen chloride, the final product is:", "opts": ["1,2-dichloroethane", "chloroethene only", "1,1-dichloroethane", "2,2-dichloroethane"], "ans": "C", "exp": "The first HCl gives vinyl chloride (chloroethene). The second HCl adds Markovnikov to the remaining double bond, placing both chlorines on the same carbon: 1,1-dichloroethane (a gem-dichloride)."}, {"n": 46, "section": "ALKYNES", "q": "One mole of ethyne reacts with one mole of bromine. The organic product is:", "opts": ["1,2-dibromoethane", "1,1-dibromoethane", "1,2-dibromoethene", "tetrabromoethane"], "ans": "C", "exp": "One equivalent of Br<sub>2</sub> adds across the triple bond to give the dihaloalkene 1,2-dibromoethene; a second equivalent would give 1,1,2,2-tetrabromoethane."}, {"n": 47, "section": "ALKYNES", "q": "Passing ethyne through a red-hot iron tube (Berthelot reaction) produces:", "opts": ["polyethene", "benzene", "ethene", "cyclohexane"], "ans": "B", "exp": "Three ethyne molecules cyclize and rearrange on the hot metal surface to benzene, C<sub>6</sub>H<sub>6</sub> — the classic synthesis joining the aliphatic and aromatic worlds."}, {"n": 48, "section": "ALKYNES", "q": "Ethyne gives a white precipitate with ammoniacal silver nitrate. This is because:", "opts": ["the terminal hydrogen of ethyne is acidic enough to be replaced by the silver ion", "ethyne is strongly basic", "silver catalyzes its polymerization", "ethyne is oxidized to ethanal"], "ans": "A", "exp": "The sp-hybridized carbon holds the electron density tightly, so ≡C-H has acidic character. Ag<sup>+</sup> displaces the H<sup>+</sup> to form silver acetylide, AgC≡CAg, a white solid; ethene shows no such reaction."}, {"n": 49, "section": "ALKYNES", "q": "The oxy-acetylene flame is valued in metal welding because:", "opts": ["it is smokeless", "acetylene is cheap", "it produces a reducing atmosphere only", "it reaches about 3000°C, high enough to melt steel"], "ans": "D", "exp": "The combustion of ethyne is highly exothermic (its two π bonds store energy), and the flame temperature of roughly 3000°C can cut and weld high-melting metals."}, {"n": 50, "section": "ALKYNES", "q": "Ethyne reacts with sodium metal in liquid ammonia, liberating a gas. The organic product is:", "opts": ["ethane", "sodium ethoxide", "sodium acetylide", "ethenyl sodium"], "ans": "C", "exp": "The acidic terminal hydrogen is displaced: HC≡CH + Na → HC≡CNa + ½H<sub>2</sub>. The gas evolved is hydrogen and the salt is monosodium acetylide."}, {"n": 51, "section": "ALKYNES", "q": "What mass of ethyne can be prepared from 64 g of calcium carbide (M = 64), assuming complete hydrolysis?", "opts": ["13 g", "32 g", "52 g", "26 g"], "ans": "D", "exp": "CaC<sub>2</sub> + 2H<sub>2</sub>O → C<sub>2</sub>H<sub>2</sub> + Ca(OH)<sub>2</sub> is a 1:1 mole reaction. 64 g = 1 mol of CaC<sub>2</sub> gives 1 mol of ethyne, whose molar mass is 26 g."}, {"n": 52, "section": "ALCOHOLS & PHENOLS-TYPE REACTIONS", "q": "Lucas reagent, used to classify alcohols, consists of:", "opts": ["iodine in NaOH solution", "dilute KMnO<sub>4</sub>", "concentrated HCl with anhydrous ZnCl<sub>2</sub>", "bromine in CCl<sub>4</sub>"], "ans": "C", "exp": "The Lewis acid ZnCl<sub>2</sub> helps convert the -OH into a good leaving group; the rate of turbidity (alkyl chloride formation) reveals the alcohol class."}, {"n": 53, "section": "ALCOHOLS", "q": "Which alcohol gives immediate turbidity with Lucas reagent at room temperature?", "opts": ["Butan-1-ol", "Butan-2-ol", "2-methylpropan-2-ol", "propan-1-ol"], "ans": "C", "exp": "Tertiary alcohols form the stable tertiary carbocation fastest, so the chloride separates at once; secondary alcohols take minutes and primary ones only react on heating."}, {"n": 54, "section": "ALCOHOLS", "q": "Which of the following gives a yellow precipitate with iodine and aqueous NaOH?", "opts": ["Propan-1-ol", "Methanol", "2-methylpropan-2-ol", "Propan-2-ol"], "ans": "D", "exp": "The iodoform test needs a CH<sub>3</sub>CH(OH)- group (or CH<sub>3</sub>CO-). Only propan-2-ol among these fits, giving yellow CHI<sub>3</sub>. Ethanol is the only primary alcohol that also passes."}, {"n": 55, "section": "ALCOHOLS", "q": "When ethanol reacts with sodium metal, the gas evolved is:", "opts": ["hydrogen", "oxygen", "carbon dioxide", "ethene"], "ans": "A", "exp": "2C<sub>2</sub>H<sub>5</sub>OH + 2Na → 2C<sub>2</sub>H<sub>5</sub>ONa + H<sub>2</sub>. The acidic O-H hydrogen is displaced; the product, sodium ethoxide, is a strong base."}, {"n": 56, "section": "ALCOHOLS", "q": "Propan-1-ol is oxidized with acidified K<sub>2</sub>Cr<sub>2</sub>O<sub>7</sub> and the volatile product is DISTILLED OFF as it forms. The main product is:", "opts": ["propanone", "propanoic acid", "propanal", "propene"], "ans": "C", "exp": "Distilling as it forms removes the aldehyde before further oxidation: propan-1-ol → propanal. Under reflux (no distillation) the product continues to propanoic acid."}, {"n": 57, "section": "ALCOHOLS", "q": "Which alcohol is NOT oxidized by acidified KMnO<sub>4</sub> under normal laboratory conditions?", "opts": ["Propan-1-ol", "Butan-2-ol", "2-methylpropan-2-ol", "propan-2-ol"], "ans": "C", "exp": "Oxidation requires at least one hydrogen on the carbon bearing the OH group. The tertiary alcohol 2-methylpropan-2-ol has three alkyl groups and no α-hydrogen on that carbon, so no mild oxidant can attack it."}, {"n": 58, "section": "ALCOHOLS", "q": "The fermentation of glucose by yeast (zymase) produces:", "opts": ["ethanol and carbon dioxide", "ethanol and oxygen", "ethanal and hydrogen", "ethanoic acid only"], "ans": "A", "exp": "C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> → 2C<sub>2</sub>H<sub>5</sub>OH + 2CO<sub>2</sub>. The process stops naturally near 15% ethanol when the yeast is inhibited."}, {"n": 59, "section": "ALCOHOLS", "q": "Why does ethanol boil at 78°C while its isomer methoxymethane boils at -24°C?", "opts": ["ethanol has a larger molar mass", "ethanol is ionic", "ethanol molecules hydrogen-bond strongly with each other; ethers cannot donate hydrogen bonds", "methoxymethane is aromatic"], "ans": "C", "exp": "Ethanol's O-H lets each molecule donate and accept hydrogen bonds, needing far more energy to vaporize. The ether has no O-H and only weak dipole-dipole attraction."}, {"n": 60, "section": "ALCOHOLS", "q": "Ethane-1,2-diol (ethylene glycol) is widely used as:", "opts": ["a fertiliser", "a food preservative", "an antifreeze in car radiators", "a fuel for engines"], "ans": "C", "exp": "Its high boiling point, miscibility with water and ability to lower water's freezing point make it the standard radiator antifreeze and coolant."}, {"n": 61, "section": "ALCOHOLS", "q": "Absolute alcohol is ethanol that is:", "opts": ["essentially 100% (99.5%+), all water removed", "about 50% by volume", "about 95% by volume", "denatured with methanol"], "ans": "A", "exp": "Rectified spirit is about 95% ethanol (the azeotrope limit of simple distillation); absolute alcohol is the water-free ~99.5%+ product obtained with dehydrating agents."}, {"n": 62, "section": "ALCOHOLS", "q": "When ethanol vapour is passed over hot copper (about 300°C) in the absence of air, the product is:", "opts": ["ethene", "ethanal", "ethanoic acid", "diethyl ether"], "ans": "B", "exp": "Copper catalyzes dehydrogenation: CH<sub>3</sub>CH<sub>2</sub>OH → CH<sub>3</sub>CHO + H<sub>2</sub>. No air means no oxidation beyond the aldehyde."}, {"n": 63, "section": "ALCOHOLS", "q": "Glycerol (glycerine) is the trivial name of:", "opts": ["propan-1-ol", "propan-1,2-diol", "propan-1,2,3-triol", "propan-2,3-diol"], "ans": "C", "exp": "Glycerol carries a hydroxyl group on every carbon: propan-1,2,3-triol. It is a sweet, viscous liquid produced in soap-making."}, {"n": 64, "section": "ALCOHOLS", "q": "In the esterification of ethanol with ethanoic acid, the concentrated H<sub>2</sub>SO<sub>4</sub> serves as:", "opts": ["a reducing agent", "an oxidizing agent", "a nucleophile", "a catalyst and dehydrating agent that shifts the equilibrium towards ester"], "ans": "D", "exp": "H<sub>2</sub>SO<sub>4</sub> protonates the acid to speed up the reaction AND removes water, driving the reversible equilibrium towards more ethyl ethanoate."}, {"n": 65, "section": "ALCOHOLS", "q": "Direct hydration of propene over H<sub>3</sub>PO<sub>4</sub> gives mainly:", "opts": ["propan-1-ol", "propanal", "propan-2-ol", "propanoic acid"], "ans": "C", "exp": "Markovnikov addition puts the OH on the middle carbon (the more substituted carbocation), so propene yields propan-2-ol, not propan-1-ol."}, {"n": 66, "section": "ETHERS", "q": "Diethyl ether is heated with EXCESS hot concentrated HI. The products are:", "opts": ["ethanol and iodoethane", "ethene and water", "ethoxyethane and hydrogen", "two moles of iodoethane"], "ans": "D", "exp": "Excess hot HI cleaves both C-O bonds: C<sub>2</sub>H<sub>5</sub>OC<sub>2</sub>H<sub>5</sub> + 2HI → 2C<sub>2</sub>H<sub>5</sub>I + H<sub>2</sub>O. With cold dilute HI only one bond breaks, giving one alcohol and one iodide."}, {"n": 67, "section": "ETHERS", "q": "Ethers are relatively unreactive towards sodium, dilute acids and oxidizing agents because:", "opts": ["they are gases", "the C-O bond is ionic", "they contain double bonds", "they have no reactive O-H bond and no electron-deficient carbon under these conditions"], "ans": "D", "exp": "With both oxygens already fully bonded and no acidic hydrogen, ethers offer no site for nucleophiles, bases or mild oxidants, which is why they make ideal solvents."}, {"n": 68, "section": "ETHERS", "q": "In Williamson's synthesis, sodium methoxide reacts with bromoethane. The product is:", "opts": ["ethoxyethane", "propane", "ethanol", "methoxyethane"], "ans": "D", "exp": "CH<sub>3</sub>O<sup>-</sup> performs an S<sub>N</sub>2 attack on the primary halide: CH<sub>3</sub>OC<sub>2</sub>H<sub>5</sub> (methoxyethane) + NaBr."}, {"n": 69, "section": "ETHERS", "q": "Why must old bottles of diethyl ether be tested before distillation in the laboratory?", "opts": ["ether absorbs water and becomes dangerous", "ether polymerizes spontaneously", "ether slowly forms explosive peroxides on contact with air and light", "ether evaporates completely"], "ans": "C", "exp": "Ethers react with atmospheric oxygen to build up peroxides, which concentrate in the distillation residue and can detonate, so old ether is tested for peroxides first."}, {"n": 70, "section": "ETHERS", "q": "The boiling point of an ether is much lower than that of its isomeric alcohol because:", "opts": ["ethers cannot form intermolecular hydrogen bonds with each other", "ethers have higher molar masses", "ethers are ionic", "ethers contain double bonds"], "ans": "A", "exp": "Although an ether can accept a hydrogen bond, it has no O-H to donate, so ether molecules associate only weakly and escape much more easily."}, {"n": 71, "section": "ETHERS", "q": "Which of the following is NOT a common use of diethyl ether?", "opts": ["Antifreeze", "Laboratory solvent", "Anaesthetic", "Starting fluid for engines"], "ans": "A", "exp": "Diethyl ether is prized as a solvent, was the classic surgical anaesthetic and is an engine starting fluid, but it boils far too low (35°C) to serve as antifreeze, which is a job for glycols."}, {"n": 72, "section": "AMINES & NITRILES", "q": "Ethylamine is a stronger base than ammonia because:", "opts": ["the N-H bonds are weaker in ethylamine", "ethylamine is aromatic", "it cannot be protonated", "the ethyl group donates electron density inductively, making nitrogen's lone pair more available"], "ans": "D", "exp": "The alkyl group pushes electron density (+I effect) onto nitrogen, concentrating charge on the lone pair and strengthening its hold on a proton. Gas-phase basicity rises from NH<sub>3</sub> through to tertiary amines."}, {"n": 73, "section": "AMINES & NITRILES", "q": "Aniline (phenylamine) is a weaker base than ethylamine because:", "opts": ["it is insoluble in water", "its nitrogen lone pair is delocalized into the benzene ring and less available for protonation", "it has no lone pair at all", "its molar mass is larger"], "ans": "B", "exp": "The lone pair participates in the ring's π system, so aniline's nitrogen shares it with the ring instead of offering it to a proton. Aliphatic amines have no such delocalization."}, {"n": 74, "section": "AMINES & NITRILES", "q": "A primary aliphatic amine reacts with cold dilute nitrous acid (HNO<sub>2</sub>) giving an alcohol and a colourless gas. The gas is:", "opts": ["hydrogen", "nitrogen", "oxygen", "nitrogen dioxide"], "ans": "B", "exp": "RNH<sub>2</sub> + HNO<sub>2</sub> → ROH + N<sub>2</sub> + H<sub>2</sub>O. The brisk, steady evolution of nitrogen (which turns limewater colourless... actually N<sub>2</sub> simply fails to re-light) distinguishes primary amines; secondary amines give an oily nitrosamine and no gas."}, {"n": 75, "section": "AMINES & NITRILES", "q": "Ethanenitrile (CH<sub>3</sub>CN) is completely reduced with H<sub>2</sub>/Ni or LiAlH<sub>4</sub>. The product is:", "opts": ["methylamine", "ethylamine", "ethanol", "ethane"], "ans": "B", "exp": "Reduction of a nitrile converts C≡N into CH<sub>2</sub>NH<sub>2</sub> without changing the carbon count: CH<sub>3</sub>CN (2 carbons) → CH<sub>3</sub>CH<sub>2</sub>NH<sub>2</sub>, a primary amine with one MORE carbon than the alkyl group attached to CN."}, {"n": 76, "section": "AMINES & NITRILES", "q": "Propanamide (CH<sub>3</sub>CH<sub>2</sub>CONH<sub>2</sub>) is treated with bromine and concentrated KOH (Hofmann degradation). The amine formed is:", "opts": ["propan-1-amine", "ethanamine", "methanamine", "butan-1-amine"], "ans": "B", "exp": "Hofmann degradation removes the carbonyl carbon: RCONH<sub>2</sub> → RNH<sub>2</sub> one carbon SHORTER. Propanamide (3 carbons) gives ethylamine (2 carbons), the mirror image of nitrile reduction."}, {"n": 77, "section": "AMINES & NITRILES", "q": "Tertiary amines boil LOWER than their isomeric primary and secondary amines because:", "opts": ["they are lighter molecules", "they have no N-H bond and cannot donate hydrogen bonds", "they are aromatic", "they contain double bonds"], "ans": "B", "exp": "With all three hydrogens on nitrogen replaced by alkyl groups, tertiary amines can only accept hydrogen bonds, so intermolecular attraction is weakest and the boiling point lowest for a given formula."}, {"n": 78, "section": "AMINES & NITRILES", "q": "When ammonia is exhaustively alkylated with excess iodomethane, the final product is:", "opts": ["methylamine", "trimethylamine only", "methane", "tetramethylammonium iodide"], "ans": "D", "exp": "Successive substitutions pass through the 1°, 2° and 3° amines until the quaternary salt (CH<sub>3</sub>)<sub>4</sub>N<sup>+</sup>I<sup>-</sup> forms, which can no longer donate a lone pair to react further."}, {"n": 79, "section": "AMINES & NITRILES", "q": "The fishy smell of amines can be removed by washing with dilute acid because:", "opts": ["the amine is converted into a non-volatile, water-soluble ionic salt", "the acid oxidizes the amine", "the smell dissolves in the acid", "amines react to give esters"], "ans": "A", "exp": "RNH<sub>2</sub> + HCl → RNH<sub>3</sub><sup>+</sup>Cl<sup>-</sup>. The ammonium salt is ionic, non-volatile and stays in the wash water, taking the odour with it."}, {"n": 80, "section": "REACTION MECHANISMS & TESTS", "q": "The correct order of carbocation stability is:", "opts": ["CH<sub>3</sub><sup>+</sup> > primary > secondary > tertiary", "tertiary > secondary > primary > CH<sub>3</sub><sup>+</sup>", "secondary > tertiary > primary > CH<sub>3</sub><sup>+</sup>", "primary > secondary > tertiary > CH<sub>3</sub><sup>+</sup>"], "ans": "B", "exp": "Alkyl groups stabilize the positive charge by inductive donation and hyperconjugation, so the more alkyl groups attached to the cationic carbon, the more stable the carbocation."}, {"n": 81, "section": "REACTION MECHANISMS & TESTS", "q": "In reaction mechanism terminology, a nucleophile is best described as:", "opts": ["an electron-pair donor seeking an electron-deficient centre", "an electron-pair acceptor", "a species that always bears a positive charge", "a free radical"], "ans": "A", "exp": "Nucleophiles (OH<sup>-</sup>, CN<sup>-</sup>, NH<sub>3</sub>, H<sub>2</sub>O) donate a lone pair to an electron-poor carbon; an electron-pair acceptor is the electrophile."}, {"n": 82, "section": "REACTION MECHANISMS & TESTS", "q": "The order of reactivity of alkyl halides towards the S<sub>N</sub>2 mechanism is:", "opts": ["tertiary > secondary > primary > methyl", "methyl > primary > secondary > tertiary", "secondary > primary > tertiary > methyl", "all react equally fast"], "ans": "B", "exp": "S<sub>N</sub>2 requires backside attack in one step, so steric crowding is fatal: the methyl halide is fastest and a tertiary halide effectively never reacts by S<sub>N</sub>2 (it goes S<sub>N</sub>1)."}, {"n": 83, "section": "REACTION MECHANISMS & TESTS", "q": "In an S<sub>N</sub>1 reaction of 2-bromo-2-methylpropane with water, the rate-determining step is:", "opts": ["attack of water on the carbon", "protonation of the leaving group", "rearrangement of the product", "ionization to form the tertiary carbocation"], "ans": "D", "exp": "The slow, unimolecular ionization C-Br → C<sup>+</sup> + Br<sup>-</sup> controls the rate, so rate = k[(CH<sub>3</sub>)<sub>3</sub>CBr] and is independent of the nucleophile concentration."}, {"n": 84, "section": "REACTION MECHANISMS & TESTS", "q": "2-bromo-2-methylpropane hydrolyses in water far faster than 1-bromobutane. The best explanation is:", "opts": ["the tertiary carbocation intermediate is stabilized by the inductive effect of its three methyl groups", "bromine is a better leaving group in the tertiary compound", "1-bromobutane cannot form a carbocation at all", "water is a stronger nucleophile toward tertiary halides"], "ans": "A", "exp": "The three electron-donating methyl groups spread the positive charge, lowering the activation energy of carbocation formation, the key step of the S<sub>N</sub>1 path that tertiary halides prefer."}, {"n": 85, "section": "REACTION MECHANISMS & TESTS", "q": "Which reagent gives a brick-red precipitate with propanal but NOT with propanone?", "opts": ["Bromine water", "Fehling's solution", "Litmus solution", "Sodium hydroxide"], "ans": "B", "exp": "Fehling's solution (Cu<sup>2+</sup> in alkaline tartrate) is reduced only by aldehydes to red Cu<sub>2</sub>O. Ketones lack the oxidizable H on the carbonyl carbon, so they give no precipitate."}, {"n": 86, "section": "REACTION MECHANISMS & TESTS", "q": "The silver mirror test uses ammoniacal silver nitrate. A positive result indicates the presence of:", "opts": ["an aldehyde, which reduces Ag<sup>+</sup> to metallic silver", "a ketone", "an alkene", "an amine"], "ans": "A", "exp": "RCHO + 2[Ag(NH<sub>3</sub>)<sub>2</sub>]<sup>+</sup> → RCOO<sup>-</sup> + 2Ag (mirror) + NH<sub>4</sub><sup>+</sup>. The aldehyde is oxidized while silver is reduced onto the glass; ketones stay negative."}, {"n": 87, "section": "REACTION MECHANISMS & TESTS", "q": "Bromine water is added separately to hexane and hex-1-ene in the DARK. The result is:", "opts": ["both decolourize immediately", "neither decolourizes", "only hex-1-ene decolourizes rapidly; hexane shows no reaction in the dark", "both give precipitates"], "ans": "C", "exp": "The alkene's π bond adds bromine instantly; the alkane needs UV light for radical substitution, so in the dark it leaves the bromine water orange."}, {"n": 88, "section": "REACTION MECHANISMS & TESTS", "q": "The simplest laboratory test to distinguish hexane from hex-1-ene is:", "opts": ["measure their densities", "add dilute NaOH", "heat both and compare flames", "add bromine water and watch for rapid decolourization"], "ans": "D", "exp": "Rapid decolourization of bromine water by hex-1-ene (addition to C=C) against no change for hexane cleanly separates the unsaturated from the saturated compound."}, {"n": 89, "section": "REACTION MECHANISMS & TESTS", "q": "2,4-dinitrophenylhydrazine (2,4-DNPH) gives a yellow/orange precipitate with:", "opts": ["alcohols and ethers", "alkenes", "amines", "aldehydes and ketones (carbonyl compounds)"], "ans": "D", "exp": "2,4-DNPH condenses with the C=O group to form bright hydrazones, making it the standard test that separates carbonyl compounds from alcohols and ethers."}, {"n": 90, "section": "REACTION MECHANISMS & TESTS", "q": "The iodoform test can be used to distinguish ethanol from methanol because:", "opts": ["both give yellow precipitates", "only ethanol (CH<sub>3</sub>CH<sub>2</sub>OH) contains the CH<sub>3</sub>CH(OH)- unit needed to give yellow CHI<sub>3</sub>", "methanol is insoluble", "ethanol is coloured"], "ans": "B", "exp": "The test needs a CH<sub>3</sub>CO- or CH<sub>3</sub>CH(OH)- fragment. Ethanol is first oxidized to ethanal by the reagent and then gives yellow iodoform; methanol cannot satisfy either condition."}, {"n": 91, "section": "REACTION MECHANISMS & TESTS", "q": "Alkaline hydrolysis (saponification) of a fat yields:", "opts": ["ethanol and ethanoic acid", "glucose", "glycerol and the sodium salts of fatty acids (soap)", "propane-1,2,3-triol and an aldehyde"], "ans": "C", "exp": "Boiling animal fat with NaOH breaks the ester links: glycerol is freed and the long-chain acids appear as their sodium salts, which is soap."}, {"n": 92, "section": "ORGANIC CALCULATIONS", "q": "A hydrocarbon is found to contain 82.8% carbon by mass. Its molecular formula could be:", "opts": ["C<sub>2</sub>H<sub>6</sub>", "C<sub>4</sub>H<sub>10</sub>", "C<sub>3</sub>H<sub>8</sub>", "C<sub>5</sub>H<sub>12</sub>"], "ans": "B", "exp": "Per 100 g: C = 82.8/12 = 6.9 mol; H = 17.2/1 = 17.2 mol; ratio C:H ≈ 1:2.5, i.e. 4:10, so C<sub>4</sub>H<sub>10</sub> (butane: 48/58 = 82.8% C)."}, {"n": 93, "section": "ORGANIC CALCULATIONS", "q": "An organic acid contains 40.0% carbon, 6.7% hydrogen and 53.3% oxygen. Its empirical formula is:", "opts": ["C<sub>2</sub>H<sub>4</sub>O", "CH<sub>2</sub>O", "CH<sub>4</sub>O", "CHO<sub>2</sub>"], "ans": "B", "exp": "Moles: 40/12 = 3.33, 6.7/1 = 6.7, 53.3/16 = 3.33. Dividing by 3.33 gives 1:2:1, so CH<sub>2</sub>O. (With M<sub>r</sub> = 60 this is ethanoic acid, C<sub>2</sub>H<sub>4</sub>O<sub>2</sub> = 2 × CH<sub>2</sub>O.)"}, {"n": 94, "section": "ORGANIC CALCULATIONS", "q": "10 cm<sup>3</sup> of a gaseous alkane requires exactly 50 cm<sup>3</sup> of oxygen for complete combustion (same conditions). The alkane is:", "opts": ["propane", "methane", "ethane", "butane"], "ans": "A", "exp": "Volume ratio alkane:O<sub>2</sub> = 10:50 = 1:5. From C<sub>n</sub>H<sub>2n+2</sub> + (3n+1)/2 O<sub>2</sub> → products, (3n+1)/2 = 5 gives n = 3: propane (C<sub>3</sub>H<sub>8</sub> + 5O<sub>2</sub>)."}, {"n": 95, "section": "ORGANIC CALCULATIONS", "q": "4.6 g of ethanol (M<sub>r</sub> = 46) is completely dehydrated to ethene. What volume of ethene is produced at s.t.p.? (molar volume = 22.4 dm<sup>3</sup>)", "opts": ["1.12 dm<sup>3</sup>", "4.48 dm<sup>3</sup>", "22.4 dm<sup>3</sup>", "2.24 dm<sup>3</sup>"], "ans": "D", "exp": "Moles of ethanol = 4.6/46 = 0.1. Dehydration is 1:1, so 0.1 mol of ethene forms: 0.1 × 22.4 = 2.24 dm<sup>3</sup>."}, {"n": 96, "section": "ORGANIC CALCULATIONS", "q": "6.0 g of a monobasic carboxylic acid is exactly neutralized by 4.0 g of NaOH (M<sub>r</sub> = 40). The molar mass of the acid is:", "opts": ["30 g", "45 g", "90 g", "60 g"], "ans": "D", "exp": "NaOH moles = 4.0/40 = 0.1. A monobasic acid reacts 1:1, so acid moles = 0.1, giving M = 6.0/0.1 = 60 g mol<sup>-1</sup> (ethanoic acid, CH<sub>3</sub>COOH)."}, {"n": 97, "section": "ORGANIC CALCULATIONS", "q": "A hydrocarbon contains 85.7% carbon by mass. A possible molecular formula is:", "opts": ["C<sub>3</sub>H<sub>8</sub>", "C<sub>2</sub>H<sub>6</sub>", "C<sub>3</sub>H<sub>6</sub>", "C<sub>4</sub>H<sub>10</sub>"], "ans": "C", "exp": "85.7% C fits the CH<sub>2</sub> unit (12/14 = 85.7%), the signature of the C<sub>n</sub>H<sub>2n</sub> family, so C<sub>3</sub>H<sub>6</sub> qualifies (it could be propene or cyclopropane). The others are C<sub>n</sub>H<sub>2n+2</sub> members with lower carbon percentages."}, {"n": 98, "section": "ORGANIC CALCULATIONS", "q": "What total volume of CO<sub>2</sub> at s.t.p. is produced when 6.0 g of ethane (M<sub>r</sub> = 30) is completely burned?", "opts": ["2.24 dm<sup>3</sup>", "4.48 dm<sup>3</sup>", "11.2 dm<sup>3</sup>", "8.96 dm<sup>3</sup>"], "ans": "D", "exp": "Moles of ethane = 6.0/30 = 0.2. From 2C<sub>2</sub>H<sub>6</sub> + 7O<sub>2</sub> → 4CO<sub>2</sub> + 6H<sub>2</sub>O, each mole of ethane gives 2 moles of CO<sub>2</sub>: 0.4 mol × 22.4 = 8.96 dm<sup>3</sup>."}, {"n": 99, "section": "ORGANIC CALCULATIONS", "q": "8.8 g of an ester (M<sub>r</sub> = 88) is hydrolysed with aqueous alkali to give ethanol and the sodium salt of a carboxylic acid. The ester is:", "opts": ["ethyl methanoate", "methyl propanoate", "ethyl ethanoate", "propyl methanoate"], "ans": "C", "exp": "The ester must be made from ethanol (to release it) and ethanoic acid (to give sodium ethanoate): CH<sub>3</sub>COOC<sub>2</sub>H<sub>5</sub>, whose M<sub>r</sub> is 88. Methyl propanoate also has M<sub>r</sub> = 88 but hydrolyses to methanol, so it fails the stated products."}, {"n": 100, "section": "ORGANIC CALCULATIONS", "q": "7.0 g of a gaseous alkene occupies 5.6 dm<sup>3</sup> at s.t.p. (molar volume = 22.4 dm<sup>3</sup>). The alkene is:", "opts": ["propene", "ethene", "but-1-ene", "ethyne"], "ans": "B", "exp": "Moles of gas = 5.6/22.4 = 0.25, so M<sub>r</sub> = 7.0/0.25 = 28. The C<sub>n</sub>H<sub>2n</sub> member with M<sub>r</sub> = 28 is C<sub>2</sub>H<sub>4</sub>, ethene."}];
let picks=Array(100).fill(null), graded=false;
const list=document.getElementById('list');
let lastSec='', html='';
DATA.forEach(function(q,i){
  if(q.section!==lastSec){html+='<div class="sechead">'+q.section+'</div>';lastSec=q.section;}
  html+='<div class="card" id="c'+i+'"><div class="qmeta"><span class="qnum">Q'+q.n+'</span><span class="qtag">'+(i+1)+' of 100</span></div><div class="qtext">'+q.q+'</div>';
  q.opts.forEach(function(o,j){
    html+='<div class="opt" id="o'+i+'_'+j+'" onclick="pick('+i+','+j+')"><span class="key">'+'ABCD'[j]+'</span><span>'+o+'</span></div>';
  });
  html+='<div class="verdict" id="v'+i+'"></div><div class="exp"><b>EXPLANATION</b>'+q.exp+'</div></div>';
});
list.innerHTML=html;
function pick(i,j){
  if(graded)return;
  picks[i]=j;
  for(let k=0;k<4;k++)document.getElementById('o'+i+'_'+k).classList.toggle('sel',k===j);
  document.getElementById('prog').textContent=picks.filter(function(p){return p!==null}).length+' / 100 answered';
}
function grade(){
  if(graded)return;
  const un=picks.filter(function(p){return p===null}).length;
  let correct=0;
  DATA.forEach(function(q,i){
    const a='ABCD'.indexOf(q.ans);
    for(let k=0;k<4;k++){
      const el=document.getElementById('o'+i+'_'+k);
      el.classList.add('dis');el.classList.remove('sel');
      if(k===a)el.classList.add('correct');
      else if(picks[i]===k)el.classList.add('miss');
    }
    const card=document.getElementById('c'+i), v=document.getElementById('v'+i);
    card.classList.add('done');
    if(picks[i]===a){correct++;card.classList.add('right');v.textContent='✔ Correct';v.className='verdict ok';}
    else{card.classList.add('wrong');v.textContent=picks[i]===null?'— Not answered':'✘ Wrong';v.className='verdict no';}
  });
  graded=true;
  const pct=Math.round(correct/100*100);
  document.getElementById('scoreN').textContent=correct+'/100';
  document.getElementById('scoreD').textContent=correct+' correct · '+(100-correct-un)+' wrong · '+un+' unanswered · '+pct+'%';
  document.getElementById('scoreM').textContent=pct>=70?'Excellent — pass mark cleared.':(pct>=50?'Fair. Review the explanations and retake.':'Study the explanations below, then retake.');
  const s=document.getElementById('score');s.classList.add('show');
  s.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit').style.display='none';
  document.getElementById('reset').style.display='block';
}
function resetAll(){
  graded=false;picks=Array(100).fill(null);
  document.querySelectorAll('.opt').forEach(function(e){e.classList.remove('sel','correct','miss','dis');});
  document.querySelectorAll('.card').forEach(function(e){e.classList.remove('done','right','wrong');});
  document.querySelectorAll('.verdict').forEach(function(e){e.textContent='';});
  document.getElementById('score').classList.remove('show');
  document.getElementById('submit').style.display='block';
  document.getElementById('reset').style.display='none';
  document.getElementById('prog').textContent='0 / 100 answered';
  window.scrollTo({top:0,behavior:'smooth'});
}
</script></body></html>
